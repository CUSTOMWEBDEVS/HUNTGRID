import { getAll, put, getPendingSync, mergeRecords, addLog } from './storage.js';
import { toast } from './ui.js';
import { refreshWaypoints } from './waypoints.js';
import { renderTrackList } from './tracks.js';

let syncTimer = null;

/** Read sync settings from localStorage. */
function settings() {
  return {
    url: localStorage.getItem('hunttrack.gasUrl') || '',
    token: localStorage.getItem('hunttrack.gasToken') || ''
  };
}

/** Initialize network listeners and background sync. */
export function initSync() {
  updateSyncStats();
  window.addEventListener('online', () => { toast('Back online — syncing'); syncNow(); });
  window.addEventListener('offline', () => toast('You are offline — using cached data'));
  syncTimer = setInterval(() => {
    if (navigator.onLine) syncNow(false);
  }, 30000);
}

/** Validate GAS endpoint with ping. */
export async function validateEndpoint(url, token) {
  const result = await jsonp(url, { action: 'ping', token });
  if (!result.ok) throw new Error(result.error || 'Connection failed');
  return result;
}

/** Perform full sync. */
export async function syncNow(showToast = true) {
  const { url, token } = settings();
  if (!url || !token) {
    await updateSyncStats();
    if (showToast) toast('Add GAS URL and token in Settings', 'error');
    return false;
  }
  if (!navigator.onLine) {
    if (showToast) toast('Offline — changes will sync when connected', 'error');
    return false;
  }
  try {
    const pending = await getPendingSync();
    for (const waypoint of pending.waypoints) {
      await jsonp(url, { action: waypoint.deleted ? 'deleteWaypoint' : 'saveWaypoint', token, payload: JSON.stringify({ waypoint, id: waypoint.id }) });
      if (waypoint.deleted) {
        // Keep tombstone local until remote confirms through pull; GAS delete is enough for now.
        waypoint.synced = true;
      } else {
        await put('waypoints', { ...waypoint, synced: true });
      }
    }
    for (const track of pending.tracks) {
      await jsonp(url, { action: track.deleted ? 'deleteTrack' : 'saveTrack', token, payload: JSON.stringify({ track, id: track.id }) });
      if (!track.deleted) await put('tracks', { ...track, synced: true });
    }
    const remoteWaypoints = await jsonp(url, { action: 'getWaypoints', token });
    const remoteTracks = await jsonp(url, { action: 'getTracks', token });
    await mergeRecords('waypoints', remoteWaypoints.waypoints || []);
    await mergeRecords('tracks', remoteTracks.tracks || []);
    localStorage.setItem('hunttrack.lastSync', new Date().toISOString());
    await addLog('Sync complete');
    await refreshWaypoints();
    await renderTrackList();
    await updateSyncStats();
    if (showToast) toast('Sync complete');
    return true;
  } catch (error) {
    await addLog(error.message, 'error');
    await updateSyncStats();
    if (showToast) toast('Sync failed — data saved locally', 'error');
    return false;
  }
}

/** Update sync status UI. */
export async function updateSyncStats() {
  const pending = await getPendingSync();
  const last = localStorage.getItem('hunttrack.lastSync');
  document.getElementById('lastSyncStat').textContent = last ? new Date(last).toLocaleString() : 'Never';
  document.getElementById('pendingSyncStat').textContent = pending.count;
  document.getElementById('networkStat').textContent = navigator.onLine ? 'Online' : 'Offline';
  document.getElementById('syncMiniStatus').textContent = pending.count ? `${pending.count} pending` : (navigator.onLine ? 'Synced' : 'Offline');

  const log = document.getElementById('syncLog');
  if (log) {
    const entries = (await getAll('syncLog')).sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 40);
    log.innerHTML = entries.map(e => `<div>[${new Date(e.created_at).toLocaleTimeString()}] ${escapeHtml(e.level)}: ${escapeHtml(e.message)}</div>`).join('');
  }
}

/** JSONP helper for GAS without CORS. */
export function jsonp(baseUrl, params = {}) {
  return new Promise((resolve, reject) => {
    const callback = `hunttrack_cb_${crypto.randomUUID().replaceAll('-', '')}`;
    const url = new URL(baseUrl);
    Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
    url.searchParams.set('callback', callback);
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('Connection timed out'));
    }, 20000);
    function cleanup() {
      clearTimeout(timer);
      script.remove();
      delete window[callback];
    }
    window[callback] = data => {
      cleanup();
      if (data && data.ok === false) reject(new Error(data.error || 'Request failed'));
      else resolve(data);
    };
    script.onerror = () => {
      cleanup();
      reject(new Error('Network request failed'));
    };
    script.src = url.toString();
    document.body.appendChild(script);
  });
}

/** Escape HTML in logs. */
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
