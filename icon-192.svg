import { put, getAll } from './storage.js';
import { toast, confirmModal, openSheet, closeSheet, emptyState, vibrate } from './ui.js';
import { getCurrentPosition, renderLiveTrack, renderTrack, distanceMeters } from './map.js';

let recording = false;
let paused = false;
let timer = null;
let startTime = null;
let points = [];
let wakeLockRef = null;

/** Toggle track recording from UI. */
export async function toggleRecording() {
  if (!recording) await startRecording();
  else await stopRecording();
}

/** Start track recording. */
export async function startRecording() {
  const pos = getCurrentPosition();
  if (!pos) {
    toast('GPS still acquiring', 'error');
    return;
  }
  recording = true;
  paused = false;
  points = [];
  startTime = new Date();
  document.body.classList.add('recording');
  document.getElementById('trackButtonText').textContent = 'Stop Track';
  await requestWakeLock();
  samplePoint();
  const interval = Math.max(2, Number(localStorage.getItem('hunttrack.gpsInterval') || 5)) * 1000;
  timer = setInterval(samplePoint, interval);
  toast('Track recording started');
  vibrate([25, 30, 25]);
}

/** Sample current GPS point. */
function samplePoint() {
  if (!recording || paused) return;
  const pos = getCurrentPosition();
  if (!pos) return;
  const last = points[points.length - 1];
  const next = { lat: pos.lat, lng: pos.lng, elevation_ft: metersToFeet(pos.altitude || 0), timestamp: new Date().toISOString() };
  if (!last || distanceMeters(last, next) >= 2) points.push(next);
  renderLiveTrack(points);
  updateRecordingText();
}

/** Stop and save a track. */
export async function stopRecording() {
  recording = false;
  clearInterval(timer);
  document.body.classList.remove('recording');
  document.getElementById('trackButtonText').textContent = 'Start Track';
  await releaseWakeLock();
  if (points.length < 2) {
    toast('Track discarded — not enough points', 'error');
    renderLiveTrack([]);
    return;
  }
  const nameResult = await confirmModal({
    title: 'Save Track',
    message: 'Name this track.',
    confirmText: 'Save',
    fields: [{ name: 'name', label: 'Track Name', value: `Track ${new Date().toLocaleDateString()}`, required: true }]
  });
  if (!nameResult) {
    renderLiveTrack([]);
    return;
  }
  const ended = new Date();
  const track = {
    id: crypto.randomUUID(),
    name: nameResult.name,
    points,
    distance_miles: totalDistanceMiles(points),
    duration_seconds: Math.round((ended - startTime) / 1000),
    started_at: startTime.toISOString(),
    ended_at: ended.toISOString(),
    created_at: ended.toISOString(),
    updated_at: ended.toISOString(),
    color: '#4a7c3f',
    synced: false
  };
  await put('tracks', track);
  renderTrack(track, true);
  await renderTrackList();
  toast('Track saved');
  vibrate();
}

/** Toggle pause/resume recording. */
export function togglePause() {
  paused = !paused;
  toast(paused ? 'Recording paused' : 'Recording resumed');
}

/** Render tracks list. */
export async function renderTrackList() {
  const list = document.getElementById('trackList');
  const tracks = (await getAll('tracks')).filter(t => !t.deleted).sort((a,b) => new Date(b.started_at) - new Date(a.started_at));
  list.replaceChildren();
  if (!tracks.length) {
    list.appendChild(emptyState('No tracks yet. Start recording from the map.', 'Go To Map', () => document.querySelector('[data-view="mapView"]').click()));
    return;
  }
  for (const track of tracks) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.innerHTML = `<div class="card-title"><span>${escapeHtml(track.name)}</span><span class="badge">${track.distance_miles.toFixed(2)} mi</span></div><div class="card-meta">${formatDuration(track.duration_seconds)} · ${new Date(track.started_at).toLocaleString()}</div>`;
    card.onclick = () => openTrackDetail(track);
    list.appendChild(card);
  }
}

/** Open track detail sheet. */
function openTrackDetail(track) {
  const node = document.createElement('div');
  const avg = track.duration_seconds ? track.distance_miles / (track.duration_seconds / 3600) : 0;
  node.innerHTML = `<h2>${escapeHtml(track.name)}</h2><p class="card-meta">${new Date(track.started_at).toLocaleString()}</p><div class="stat-grid"><div class="stat"><b>${track.distance_miles.toFixed(2)}</b><span>Miles</span></div><div class="stat"><b>${formatDuration(track.duration_seconds)}</b><span>Duration</span></div><div class="stat"><b>${avg.toFixed(1)}</b><span>MPH</span></div></div>`;
  const show = button('Show On Map', () => {
    renderTrack(track, true);
    closeSheet();
    document.querySelector('[data-view="mapView"]').click();
  });
  const del = button('Delete', async () => {
    const ok = await confirmModal({ title: 'Delete Track', message: `Delete ${track.name}?`, confirmText: 'Delete' });
    if (!ok) return;
    await put('tracks', { ...track, deleted: true, synced: false, updated_at: new Date().toISOString() });
    closeSheet();
    await renderTrackList();
    toast('Track deleted');
  }, 'danger');
  node.append(show, del);
  openSheet(node);
}

/** Update recording button text with distance and duration. */
function updateRecordingText() {
  const seconds = Math.round((Date.now() - startTime.getTime()) / 1000);
  document.getElementById('trackButtonText').textContent = `${totalDistanceMiles(points).toFixed(2)} mi · ${formatDuration(seconds)}`;
}

/** Request screen wake lock. */
async function requestWakeLock() {
  if (localStorage.getItem('hunttrack.wakeLock') === 'false') return;
  if ('wakeLock' in navigator) {
    try { wakeLockRef = await navigator.wakeLock.request('screen'); } catch (error) {}
  }
}

/** Release screen wake lock. */
async function releaseWakeLock() {
  if (wakeLockRef) {
    try { await wakeLockRef.release(); } catch (error) {}
    wakeLockRef = null;
  }
}

/** Sum track distance in miles. */
function totalDistanceMiles(trackPoints) {
  let meters = 0;
  for (let i = 1; i < trackPoints.length; i++) meters += distanceMeters(trackPoints[i-1], trackPoints[i]);
  return meters / 1609.344;
}

/** Format seconds as h:mm:ss. */
function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

/** Convert meters to feet. */
function metersToFeet(meters) { return Math.round(meters * 3.28084); }

/** Create button helper. */
function button(text, onClick, kind = '') {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = `button wide ${kind}`;
  b.textContent = text;
  b.onclick = onClick;
  return b;
}

/** Escape user text. */
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
